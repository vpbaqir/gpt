name: Toolbox validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/toolbox-10-utilities-2026-10-17]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run Toolbox integration checks
        run: node --test tests/*.test.mjs
      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON valid')"
