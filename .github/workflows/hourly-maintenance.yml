name: Nexus quality checks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-app:
    name: Validate Nexus app shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required app files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js manifest.webmanifest icon.svg sw.js README.md; do
            test -s "$file" || { echo "::error::Missing or empty required file: $file"; exit 1; }
          done

      - name: Verify document references and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'register("./sw.js")' app.js
          grep -q 'Nexus' index.html
          node --check app.js
          node --check sw.js
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.webmanifest","utf8")); if(!m.name.includes("Nexus") || !m.start_url || !Array.isArray(m.icons) || !m.icons.length) process.exit(1); console.log("Manifest valid:", m.name)'
          echo "All static app checks passed."

      - name: Maintenance summary
        if: always()
        run: |
          echo "Nexus validation completed for commit $GITHUB_SHA."
          echo "Scheduled runs check app health; changes are reviewed before deployment."
