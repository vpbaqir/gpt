name: Hourly app maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hourly-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-app:
    name: Validate Toolbox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required app files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js toolbox-utils.mjs manifest.webmanifest icon.svg sw.js README.md tests/toolbox-utils.test.mjs; do
            test -s "$file" || { echo "::error::Missing or empty required file: $file"; exit 1; }
          done

      - name: Verify document references and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'register("./sw.js")' app.js
          node --check app.js
          node --check toolbox-utils.mjs
          node --check sw.js
          node --test tests/toolbox-utils.test.mjs
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.webmanifest","utf8")); if(!m.name || !m.start_url || !Array.isArray(m.icons)) process.exit(1); console.log("Manifest valid:",m.name)'
          echo "Static Toolbox checks passed."
